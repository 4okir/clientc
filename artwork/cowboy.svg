<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" fill="none" role="img" aria-labelledby="cow-title cow-desc">
  <title id="cow-title">Ковбойская шляпа</title>
  <desc id="cow-desc">Шляпа с высокой тульей, продольным заломом, загнутыми полями и кожаным ремешком с металлическими украшениями.</desc>
  <defs>
    <linearGradient id="cow-felt" x1="282" y1="167" x2="658" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hat-light, #777b6b)"/>
      <stop offset=".42" stop-color="var(--hat-main, #454840)"/>
      <stop offset="1" stop-color="var(--hat-dark, #22271f)"/>
    </linearGradient>
    <linearGradient id="cow-top" x1="351" y1="133" x2="545" y2="249" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hat-light, #777b6b)"/>
      <stop offset=".57" stop-color="var(--hat-main, #454840)"/>
      <stop offset="1" stop-color="var(--hat-dark, #22271f)"/>
    </linearGradient>
    <linearGradient id="cow-brim" x1="362" y1="342" x2="459" y2="549" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hat-light, #777b6b)"/>
      <stop offset=".43" stop-color="var(--hat-main, #454840)"/>
      <stop offset="1" stop-color="var(--hat-dark, #22271f)"/>
    </linearGradient>
    <linearGradient id="cow-roll" x1="790" y1="337" x2="626" y2="456" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hat-light, #777b6b)"/>
      <stop offset=".38" stop-color="var(--hat-main, #454840)"/>
      <stop offset="1" stop-color="var(--hat-dark, #22271f)"/>
    </linearGradient>
    <linearGradient id="cow-band" x1="281" y1="362" x2="638" y2="414" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--ribbon-dark, #1b1b16)"/>
      <stop offset=".35" stop-color="var(--ribbon-light, #3b3b30)"/>
      <stop offset=".68" stop-color="var(--ribbon-main, #262720)"/>
      <stop offset="1" stop-color="var(--ribbon-dark, #141612)"/>
    </linearGradient>
    <linearGradient id="cow-metal" x1="330" y1="389" x2="342" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e9d8ac"/>
      <stop offset=".45" stop-color="#b69f71"/>
      <stop offset="1" stop-color="#7b6948"/>
    </linearGradient>
    <linearGradient id="cow-crease" x1="420" y1="165" x2="451" y2="253" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000" stop-opacity=".43"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cow-glow" cx="0" cy="0" r="1" gradientTransform="translate(351 319) rotate(17) scale(82 154)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cow-shadow" x="-.3" y="-1.5" width="1.6" height="4" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="cow-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="31" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <path id="cow-brim-shape" d="M65 329C103 345 155 394 216 405C312 425 409 429 509 414C657 393 743 354 821 313C837 304 847 308 848 323C852 372 805 431 726 478C621 541 465 558 322 529C200 505 105 450 69 389C55 365 48 322 65 329Z"/>
    <path id="cow-crown-shape" d="M269 396L292 216C297 176 321 138 353 131C387 123 409 155 443 163C478 166 497 129 532 132C574 136 605 173 617 218L660 393C608 424 536 441 458 439C376 437 311 421 269 396Z"/>
    <path id="cow-band-shape" d="M278 350C363 389 531 402 647 350L660 393C605 424 533 441 458 439C377 437 312 421 269 396L278 350Z"/>
    <clipPath id="cow-brim-clip"><use href="#cow-brim-shape"/></clipPath>
    <clipPath id="cow-crown-clip"><use href="#cow-crown-shape"/></clipPath>
    <clipPath id="cow-band-clip"><use href="#cow-band-shape"/></clipPath>
  </defs>

  <ellipse cx="459" cy="557" rx="274" ry="21" fill="#171b14" fill-opacity=".18" filter="url(#cow-shadow)"/>
  <path d="M66 337C112 358 161 400 219 413C315 434 412 438 512 422C657 401 746 363 826 321C840 314 851 319 850 332C848 384 805 441 728 487C623 549 465 565 321 537C199 512 104 458 68 397C53 372 50 330 66 337Z" fill="var(--hat-dark, #22271f)"/>

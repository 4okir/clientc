    <path d="M63 330C106 373 120 419 178 457C143 408 163 395 216 405C156 393 105 345 63 330Z" fill="var(--hat-light, #777b6b)" opacity=".67"/>
    <path d="M823 313C789 378 743 419 687 447C716 407 730 376 748 352C776 338 800 326 823 313Z" fill="url(#cow-roll)"/>
    <path d="M68 335C103 364 130 402 166 427M830 315C804 366 766 411 714 442" stroke="#fff" stroke-opacity=".14" stroke-width="2" stroke-linecap="round"/>
    <path d="M119 419C214 482 357 514 489 506C633 498 751 453 801 392" stroke="#fff" stroke-opacity=".065" stroke-width="2"/>
    <use href="#cow-brim-shape" fill="url(#cow-brim)" filter="url(#cow-grain)" opacity=".36"/>
  </g>
  <path d="M76 391C119 457 215 508 326 529C472 558 629 538 727 478C790 440 838 385 847 343" stroke="#fff" stroke-opacity=".1" stroke-width="1.7"/>
  <path d="M84 388C130 449 220 498 329 520C469 548 620 530 718 472C782 434 824 387 837 350" stroke="var(--hat-light, #777b6b)" stroke-opacity=".37" stroke-width="1.2" stroke-dasharray="2 4"/>

  <use href="#cow-crown-shape" fill="url(#cow-felt)"/>
  <g clip-path="url(#cow-crown-clip)">
    <path d="M292 216C316 167 335 143 356 143C383 142 407 175 442 181C481 189 504 144 533 144C565 145 594 179 617 220C586 207 559 193 535 197C507 202 478 223 444 220C413 218 395 195 367 191C341 188 320 202 292 216Z" fill="url(#cow-top)"/>
    <path d="M335 178C353 155 369 159 391 177C411 194 425 204 447 207C473 212 491 190 511 177C529 165 550 171 572 193C547 185 530 191 508 208C485 227 468 236 442 230C415 224 398 202 376 191C359 182 348 179 335 178Z" fill="url(#cow-crease)"/>
    <path d="M342 181C361 173 375 186 394 200C414 216 430 226 449 226C472 228 489 212 510 199C530 186 546 184 564 192" stroke="#fff" stroke-opacity=".08" stroke-width="2" stroke-linecap="round"/>
    <path d="M300 216C333 203 350 225 348 249C346 280 334 308 343 344C314 326 305 299 306 270C307 247 307 228 300 216Z" fill="#000" fill-opacity=".2"/>
    <path d="M606 217C578 204 559 219 555 242C550 270 562 293 554 327C578 308 586 287 587 260C589 238 594 225 606 217Z" fill="#000" fill-opacity=".22"/>
    <ellipse cx="351" cy="319" rx="92" ry="152" fill="url(#cow-glow)"/>
    <use href="#cow-crown-shape" fill="url(#cow-felt)" filter="url(#cow-grain)" opacity=".26"/>
  </g>
  <path d="M292 216C297 176 321 138 353 131C387 123 409 155 443 163C478 166 497 129 532 132C574 136 605 173 617 218" stroke="#fff" stroke-opacity=".11" stroke-width="1.5"/>

  <use href="#cow-band-shape" fill="url(#cow-band)"/>
  <g clip-path="url(#cow-band-clip)">
    <path d="M276 359C371 402 535 411 651 359M272 386C370 430 540 438 657 384" stroke="var(--ribbon-light, #3b3b30)" stroke-width="1.8" stroke-opacity=".8"/>
    <path d="M279 362C370 405 537 412 651 362M274 383C369 426 539 435 657 381" stroke="#d9cbaa" stroke-opacity=".29" stroke-width="1.1" stroke-dasharray="2 4"/>
  </g>
  <path d="M278 351C370 393 533 400 647 351" stroke="#e8dfc8" stroke-opacity=".13" stroke-width="1.4"/>
  <g transform="translate(337 400) rotate(15)">
    <ellipse rx="12" ry="15" fill="url(#cow-metal)"/>
    <ellipse rx="8" ry="11" stroke="#5d5037" stroke-opacity=".7"/>
    <path d="M0-6L3 0L0 6L-3 0Z" fill="#dbceb0"/>
  </g>
  <g transform="translate(469 415) rotate(-1)">
    <ellipse rx="12" ry="15" fill="url(#cow-metal)"/>
    <ellipse rx="8" ry="11" stroke="#5d5037" stroke-opacity=".7"/>
    <path d="M0-6L3 0L0 6L-3 0Z" fill="#dbceb0"/>
  </g>
  <g transform="translate(592 396) rotate(-17)">
    <ellipse rx="11" ry="14" fill="url(#cow-metal)"/>
    <ellipse rx="7" ry="10" stroke="#5d5037" stroke-opacity=".7"/>
    <path d="M0-6L3 0L0 6L-3 0Z" fill="#dbceb0"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" fill="none" role="img" aria-labelledby="top-title top-desc">
  <title id="top-title">Классический цилиндр</title>
  <desc id="top-desc">Высокая шляпа с гладкой тульей, овальными полями и широкой атласной лентой.</desc>
  <defs>
    <linearGradient id="top-crown" x1="274" y1="298" x2="648" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hat-dark, #20211f)"/>
      <stop offset=".14" stop-color="var(--hat-main, #3b3b37)"/>
      <stop offset=".3" stop-color="var(--hat-light, #62615c)"/>
      <stop offset=".58" stop-color="var(--hat-main, #3b3b37)"/>
      <stop offset="1" stop-color="var(--hat-dark, #20211f)"/>
    </linearGradient>
    <linearGradient id="top-lid" x1="360" y1="103" x2="519" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hat-light, #62615c)"/>
      <stop offset=".58" stop-color="var(--hat-main, #3b3b37)"/>
      <stop offset="1" stop-color="var(--hat-dark, #20211f)"/>
    </linearGradient>
    <linearGradient id="top-brim" x1="296" y1="398" x2="552" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hat-light, #62615c)"/>
      <stop offset=".49" stop-color="var(--hat-main, #3b3b37)"/>
      <stop offset="1" stop-color="var(--hat-dark, #20211f)"/>
    </linearGradient>
    <linearGradient id="top-edge" x1="189" y1="469" x2="726" y2="503" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hat-dark, #20211f)"/>
      <stop offset=".47" stop-color="var(--hat-main, #3b3b37)"/>
      <stop offset="1" stop-color="var(--hat-dark, #20211f)"/>
    </linearGradient>
    <linearGradient id="top-ribbon" x1="291" y1="385" x2="639" y2="427" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--ribbon-dark, #11120f)"/>
      <stop offset=".3" stop-color="var(--ribbon-light, #414239)"/>
      <stop offset=".57" stop-color="var(--ribbon-main, #24251f)"/>
      <stop offset="1" stop-color="var(--ribbon-dark, #11120f)"/>
    </linearGradient>
    <radialGradient id="top-lustre" cx="0" cy="0" r="1" gradientTransform="translate(377 261) rotate(5) scale(65 168)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".11"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="top-front-glow" cx="0" cy="0" r="1" gradientTransform="translate(364 487) rotate(4) scale(274 41)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".085"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="top-ground" x="-.3" y="-1.6" width="1.6" height="4.2" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="15"/></filter>
    <pattern id="top-satin" width="2.6" height="2.6" patternUnits="userSpaceOnUse"><path d="M0 .5H2.6" stroke="#fff" stroke-opacity=".035"/></pattern>
    <path id="top-brim-shape" d="M169 448C185 415 306 388 459 387C610 385 727 412 745 446C767 487 635 532 469 535C305 538 146 494 169 448Z"/>
    <path id="top-crown-shape" d="M272 164C290 243 299 331 282 435C363 479 559 481 647 433C627 333 630 245 650 153L272 164Z"/>
    <path id="top-band-shape" d="M288 365C382 399 550 403 637 364C639 388 642 412 647 433C559 481 363 479 282 435C286 412 288 388 288 365Z"/>
    <clipPath id="top-crown-clip"><use href="#top-crown-shape"/></clipPath>
    <clipPath id="top-brim-clip"><use href="#top-brim-shape"/></clipPath>
    <clipPath id="top-band-clip"><use href="#top-band-shape"/></clipPath>
  </defs>

  <ellipse cx="455" cy="556" rx="235" ry="18" fill="#191b16" fill-opacity=".19" filter="url(#top-ground)"/>

  <!-- A narrow rolled edge keeps the oval brim light and precise. -->
  <path d="M167 453C183 420 306 393 459 392C610 390 729 418 747 452C769 494 634 540 468 542C304 545 144 500 167 453Z" fill="url(#top-edge)"/>
  <use href="#top-brim-shape" fill="url(#top-brim)"/>
  <g clip-path="url(#top-brim-clip)">
    <ellipse cx="461" cy="422" rx="203" ry="60" fill="#000" fill-opacity=".26"/>
    <ellipse cx="364" cy="487" rx="274" ry="45" fill="url(#top-front-glow)"/>
    <path d="M184 468C263 516 579 551 731 469" stroke="#fff" stroke-opacity=".055" stroke-width="1.7"/>
  </g>
  <path d="M177 477C224 512 340 536 468 535C586 533 693 512 736 477" stroke="#fff" stroke-opacity=".075" stroke-width="1.2"/>

  <!-- The subtly waisted silk-plush crown. -->
  <use href="#top-crown-shape" fill="url(#top-crown)"/>
  <g clip-path="url(#top-crown-clip)">
    <path d="M282 185C384 222 551 221 640 178L636 222C552 255 378 256 289 221Z" fill="#000" fill-opacity=".065"/>
    <ellipse cx="377" cy="261" rx="65" ry="168" fill="url(#top-lustre)"/>
    <path d="M316 209C326 265 328 314 324 361" stroke="#fff" stroke-opacity=".025" stroke-width="2"/>
    <path d="M610 208C599 270 597 318 601 360" stroke="#000" stroke-opacity=".11" stroke-width="2"/>
  </g>

  <path d="M270 165C266 132 349 104 454 101C559 98 647 121 651 154C655 187 571 216 467 220C362 223 274 199 270 165Z" fill="url(#top-lid)"/>
  <path d="M286 164C283 136 359 114 455 111C552 108 633 128 636 155C639 183 563 207 467 210C370 213 289 192 286 164Z" stroke="#000" stroke-opacity=".12" stroke-width="1.4"/>
  <path d="M271 164C275 199 364 223 467 220C570 216 652 188 651 155" stroke="#fff" stroke-opacity=".13" stroke-width="1.5"/>
  <path d="M277 149C289 122 365 104 454 101C539 99 615 113 640 135" stroke="#fff" stroke-opacity=".06" stroke-width="1.5"/>

  <!-- Broad satin ribbon, with a small tailored bow on the near side. -->
  <use href="#top-band-shape" fill="url(#top-ribbon)"/>
  <g clip-path="url(#top-band-clip)">
    <path d="M278 359H655V477H278Z" fill="url(#top-satin)"/>
    <path d="M288 380C386 413 552 420 641 377" stroke="#fff" stroke-opacity=".055" stroke-width="1.6"/>
    <path d="M286 420C384 456 553 461 646 416" stroke="#000" stroke-opacity=".09" stroke-width="2"/>
  </g>
  <path d="M288 365C382 399 550 403 637 364" stroke="var(--ribbon-light, #414239)" stroke-opacity=".5" stroke-width="1.2"/>
  <path d="M282 435C363 479 559 481 647 433" stroke="#000" stroke-opacity=".25" stroke-width="1.5"/>
  <path d="M318 388C334 391 351 400 365 408L364 452C348 450 330 444 315 435L318 388Z" fill="var(--ribbon-dark, #11120f)"/>
  <path d="M363 407C376 406 394 402 410 400L407 451C390 455 376 456 363 452V407Z" fill="var(--ribbon-main, #24251f)"/>
  <path d="M355 402L372 409L370 456L352 450L355 402Z" fill="var(--ribbon-light, #414239)"/>
  <path d="M321 395L351 413M379 416L403 407M321 432L350 442M379 446L401 446" stroke="#000" stroke-opacity=".18" stroke-width="1.5"/>
  <path d="M357 404L369 409" stroke="#fff" stroke-opacity=".16" stroke-width="1.1"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" fill="none" role="img" aria-labelledby="bucket-title bucket-desc">
  <title id="bucket-title">Панама с мягкими полями</title>
  <desc id="bucket-desc">Объёмная тканевая панама с круглой тульей, строчкой и опущенными полями.</desc>
  <defs>
    <linearGradient id="bucket-crown-fill" x1="290" y1="205" x2="627" y2="428" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hat-light, #74776b)"/>
      <stop offset=".43" stop-color="var(--hat-main, #454840)"/>
      <stop offset="1" stop-color="var(--hat-dark, #22271f)"/>
    </linearGradient>
    <linearGradient id="bucket-top-fill" x1="342" y1="166" x2="529" y2="278" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hat-light, #74776b)"/>
      <stop offset=".73" stop-color="var(--hat-main, #454840)"/>
      <stop offset="1" stop-color="var(--hat-dark, #22271f)"/>
    </linearGradient>
    <linearGradient id="bucket-brim-fill" x1="309" y1="361" x2="500" y2="531" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hat-light, #74776b)"/>
      <stop offset=".48" stop-color="var(--hat-main, #454840)"/>
      <stop offset="1" stop-color="var(--hat-dark, #22271f)"/>
    </linearGradient>
    <linearGradient id="bucket-edge-fill" x1="258" y1="464" x2="658" y2="516" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hat-dark, #22271f)"/>
      <stop offset=".38" stop-color="var(--hat-main, #454840)"/>
      <stop offset="1" stop-color="var(--hat-dark, #22271f)"/>
    </linearGradient>
    <linearGradient id="bucket-band-fill" x1="268" y1="357" x2="629" y2="407" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--ribbon-light, #44463d)"/>
      <stop offset=".39" stop-color="var(--ribbon-main, #2d2e29)"/>
      <stop offset="1" stop-color="var(--ribbon-dark, #171815)"/>
    </linearGradient>
    <radialGradient id="bucket-brim-glow" cx="0" cy="0" r="1" gradientTransform="translate(336 442) rotate(13) scale(232 73)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".11"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bucket-crown-glow" cx="0" cy="0" r="1" gradientTransform="translate(331 266) rotate(15) scale(84 160)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="bucket-shadow" x="-.3" y="-1.5" width="1.6" height="4" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="bucket-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".64" numOctaves="3" seed="12" result="bucket-noise"/>
      <feColorMatrix in="bucket-noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".065"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <path id="bucket-brim-shape" d="M274 362C326 344 568 347 624 367C652 388 684 419 721 465C736 483 724 495 700 504C600 543 311 536 200 497C174 488 161 477 179 456C209 420 242 383 274 362Z"/>
    <path id="bucket-crown-shape" d="M291 214C297 177 354 151 442 151C526 151 588 171 602 207L642 401C596 441 346 451 258 402L291 214Z"/>
    <clipPath id="bucket-brim-clip"><use href="#bucket-brim-shape"/></clipPath>
    <clipPath id="bucket-crown-clip"><use href="#bucket-crown-shape"/></clipPath>
  </defs>

  <ellipse cx="453" cy="552" rx="227" ry="20" fill="#191b16" fill-opacity=".18" filter="url(#bucket-shadow)"/>

  <!-- The heavy front edge and curved stitching describe a downturned cloth brim. -->
  <path d="M273 369C331 350 566 355 626 374C656 397 693 435 723 471C738 490 725 502 700 511C597 549 310 543 198 504C172 495 160 482 179 462C213 423 246 388 273 369Z" fill="url(#bucket-edge-fill)"/>
  <use href="#bucket-brim-shape" fill="url(#bucket-brim-fill)"/>
  <g clip-path="url(#bucket-brim-clip)">
    <ellipse cx="449" cy="386" rx="205" ry="57" fill="#000" fill-opacity=".2"/>
    <ellipse cx="336" cy="442" rx="242" ry="81" fill="url(#bucket-brim-glow)"/>
    <use href="#bucket-brim-shape" fill="url(#bucket-brim-fill)" filter="url(#bucket-grain)" opacity=".5"/>
    <g stroke="#fff" stroke-opacity=".13" stroke-width="1.3" stroke-dasharray="2 3" stroke-linecap="round">
      <path d="M204 440C298 492 587 512 694 453"/>
      <path d="M196 450C292 503 591 523 704 463"/>
      <path d="M187 461C292 515 596 535 714 475"/>
      <path d="M184 474C287 528 594 543 717 487"/>
    </g>
    <path d="M257 394C245 416 228 435 217 457M639 397C655 417 678 442 688 465" stroke="#000" stroke-opacity=".14" stroke-width="2"/>
  </g>
  <path d="M197 496C308 537 602 546 700 504" stroke="#fff" stroke-opacity=".085" stroke-width="1.5"/>

  <!-- A gently tapered crown sits on the brim, with visible cotton panel seams. -->
  <use href="#bucket-crown-shape" fill="url(#bucket-crown-fill)"/>
  <g clip-path="url(#bucket-crown-clip)">
    <ellipse cx="447" cy="205" rx="157" ry="54" fill="url(#bucket-top-fill)"/>
    <path d="M291 215C332 260 540 280 602 210" stroke="#000" stroke-opacity=".17" stroke-width="3"/>
    <path d="M295 210C337 251 540 270 598 207" stroke="#fff" stroke-opacity=".16" stroke-width="1.3" stroke-dasharray="2 3"/>
    <path d="M305 207C353 241 539 254 587 205" stroke="#fff" stroke-opacity=".07" stroke-width="1.4"/>
    <path d="M340 244C333 288 327 341 319 405M541 251C549 295 562 357 573 418" stroke="#000" stroke-opacity=".14" stroke-width="3"/>
    <path d="M344 245C337 289 331 342 323 407M545 251C553 294 566 357 577 417" stroke="#fff" stroke-opacity=".14" stroke-width="1.1" stroke-dasharray="2 3"/>
    <ellipse cx="331" cy="266" rx="84" ry="160" fill="url(#bucket-crown-glow)"/>
    <use href="#bucket-crown-shape" fill="url(#bucket-crown-fill)" filter="url(#bucket-grain)" opacity=".33"/>
    <path d="M267 357C351 394 549 401 632 359L641 401C558 443 352 449 259 402L267 357Z" fill="url(#bucket-band-fill)"/>
    <path d="M268 359C359 398 546 399 632 361M260 398C353 440 550 439 640 398" stroke="#fff" stroke-opacity=".13" stroke-width="1.2" stroke-dasharray="2 3"/>
  </g>
  <path d="M291 213C298 177 355 151 442 151C527 151 588 171 602 207" stroke="#fff" stroke-opacity=".12" stroke-width="1.5"/>

  <!-- Subtle metal ventilation eyelets are fixed hardware, independent of fabric color. -->
  <ellipse cx="578" cy="296" rx="8" ry="6" fill="#1b1d18" fill-opacity=".7"/>
  <ellipse cx="578" cy="295" rx="6.3" ry="4.7" stroke="#c4bea5" stroke-opacity=".55" stroke-width="1.8"/>
  <ellipse cx="578" cy="295" rx="2.8" ry="2.1" fill="#10130e"/>
  <ellipse cx="597" cy="289" rx="7.3" ry="5.6" fill="#1b1d18" fill-opacity=".7"/>
  <ellipse cx="597" cy="288" rx="5.8" ry="4.3" stroke="#c4bea5" stroke-opacity=".5" stroke-width="1.7"/>
  <ellipse cx="597" cy="288" rx="2.5" ry="1.9" fill="#10130e"/>
</svg>

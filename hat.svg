<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" fill="none" role="img" aria-labelledby="hat-title hat-desc">
  <title id="hat-title">Фетровая шляпа федора</title>
  <desc id="hat-desc">Объёмная федора с широкими полями, мягкими складками и тёмной репсовой лентой.</desc>
  <defs>
    <linearGradient id="felt-crown" x1="275" y1="191" x2="679" y2="411" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hat-light, #62615c)"/>
      <stop offset=".36" stop-color="var(--hat-main, #3b3b37)"/>
      <stop offset="1" stop-color="var(--hat-dark, #20211f)"/>
    </linearGradient>
    <linearGradient id="felt-top" x1="327" y1="155" x2="579" y2="275" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hat-light, #62615c)"/>
      <stop offset=".68" stop-color="var(--hat-main, #3b3b37)"/>
      <stop offset="1" stop-color="var(--hat-dark, #20211f)"/>
    </linearGradient>
    <linearGradient id="felt-brim" x1="278" y1="350" x2="524" y2="542" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hat-light, #62615c)"/>
      <stop offset=".49" stop-color="var(--hat-main, #3b3b37)"/>
      <stop offset="1" stop-color="var(--hat-dark, #20211f)"/>
    </linearGradient>
    <linearGradient id="felt-edge" x1="187" y1="439" x2="744" y2="516" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hat-dark, #20211f)"/>
      <stop offset=".45" stop-color="var(--hat-main, #3b3b37)"/>
      <stop offset="1" stop-color="var(--hat-dark, #20211f)"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="247" y1="354" x2="676" y2="427" gradientUnits="userSpaceOnUse">
      <stop stop-color="#191a18"/>
      <stop offset=".35" stop-color="#2d2e29"/>
      <stop offset=".75" stop-color="#171815"/>
      <stop offset="1" stop-color="#10110f"/>
    </linearGradient>
    <linearGradient id="ribbon-sheen" x1="330" y1="384" x2="644" y2="421" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d3cebb" stop-opacity=".11"/>
      <stop offset="1" stop-color="#d3cebb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crease" x1="378" y1="195" x2="506" y2="251" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000" stop-opacity=".33"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="brim-light" cx="0" cy="0" r="1" gradientTransform="translate(333 443) rotate(9) scale(279 66)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".11"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crown-light" cx="0" cy="0" r="1" gradientTransform="translate(326 286) rotate(19) scale(92 148)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ground-blur" x="-.3" y="-1.6" width="1.6" height="4.2" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="felt-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="23" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".075"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <pattern id="grosgrain" width="3" height="3" patternUnits="userSpaceOnUse">
      <path d="M0 .5H3" stroke="#e9e4d7" stroke-opacity=".06"/>
    </pattern>
    <path id="brim-shape" d="M94 421C146 377 265 360 423 368C580 347 740 369 809 415C838 435 835 452 799 472C712 522 558 541 402 526C264 513 139 481 101 453C85 441 81 432 94 421Z"/>
    <path id="crown-shape" d="M231 402L272 229C280 195 310 158 346 151C382 143 409 166 447 164C494 162 526 143 564 152C614 164 647 201 658 239L701 405C646 439 558 456 458 453C358 451 280 431 231 402Z"/>
    <path id="ribbon-shape" d="M243 352C335 396 526 419 688 358L701 405C643 439 555 456 458 453C358 451 280 431 231 402L243 352Z"/>
    <clipPath id="crown-clip"><use href="#crown-shape"/></clipPath>
    <clipPath id="brim-clip"><use href="#brim-shape"/></clipPath>
    <clipPath id="ribbon-clip"><use href="#ribbon-shape"/></clipPath>
  </defs>

  <ellipse cx="460" cy="553" rx="264" ry="22" fill="#191b16" fill-opacity=".18" filter="url(#ground-blur)"/>

  <!-- The turned edge gives the wide brim its thin, physical silhouette. -->
  <path d="M92 431C161 374 284 368 425 376C589 355 745 377 812 422C839 441 837 458 800 480C715 531 557 549 402 534C260 521 139 488 100 461C85 450 81 441 92 431Z" fill="url(#felt-edge)"/>
  <use href="#brim-shape" fill="url(#felt-brim)"/>
  <g clip-path="url(#brim-clip)">
    <ellipse cx="452" cy="405" rx="255" ry="71" fill="#000" fill-opacity=".27"/>
    <ellipse cx="333" cy="443" rx="290" ry="76" fill="url(#brim-light)"/>
    <path d="M101 435C188 476 295 500 420 507C571 517 726 490 807 442" stroke="#fff" stroke-opacity=".055" stroke-width="2"/>
    <use href="#brim-shape" fill="url(#felt-brim)" filter="url(#felt-grain)" opacity=".58"/>
  </g>
  <path d="M107 451C171 490 295 518 420 527C566 537 720 514 799 471" stroke="#fff" stroke-opacity=".07" stroke-width="1.4"/>

  <!-- Pinched crown, with a sculpted centre crease. -->
  <use href="#crown-shape" fill="url(#felt-crown)"/>
  <g clip-path="url(#crown-clip)">
    <path d="M273 232C301 185 331 158 359 160C390 163 410 184 445 182C483 181 527 155 560 165C602 176 632 211 657 245C625 229 602 210 576 206C539 201 520 221 486 230C445 241 417 238 382 220C346 201 319 204 273 232Z" fill="url(#felt-top)"/>
    <path d="M307 218C332 183 349 176 369 180C392 184 410 207 444 205C482 204 516 179 548 180C575 181 596 197 616 218C580 203 560 203 534 214C504 229 479 241 443 238C408 237 387 217 367 211C344 204 328 208 307 218Z" fill="url(#crease)"/>
    <path d="M311 218C338 196 357 198 381 212C409 228 425 237 452 237C485 237 506 227 534 215C565 201 587 204 611 217" stroke="#fff" stroke-opacity=".085" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M277 231C307 225 322 238 330 258C337 280 331 299 331 317C330 338 336 353 345 366C314 354 297 328 292 304C286 279 286 253 277 231Z" fill="#000" fill-opacity=".18"/>
    <path d="M650 237C615 225 585 243 575 266C565 289 568 308 558 333C585 315 603 296 615 273C627 252 637 242 650 237Z" fill="#000" fill-opacity=".19"/>
    <ellipse cx="326" cy="286" rx="92" ry="148" fill="url(#crown-light)"/>
    <use href="#crown-shape" fill="url(#felt-crown)" filter="url(#felt-grain)" opacity=".33"/>
  </g>
  <path d="M272 229C280 195 310 158 346 151C382 143 409 166 447 164C494 162 526 143 564 152C614 164 647 201 658 239" stroke="#fff" stroke-opacity=".085" stroke-width="1.5"/>

  <!-- Grosgrain ribbon and a restrained tailored bow. -->
  <use href="#ribbon-shape" fill="url(#ribbon)"/>
  <g clip-path="url(#ribbon-clip)">
    <path d="M237 365C350 415 535 429 696 371V411C543 461 345 447 231 396Z" fill="url(#ribbon-sheen)"/>
    <path d="M222 346H709V463H222Z" fill="url(#grosgrain)"/>
  </g>
  <path d="M244 353C345 401 533 415 688 358" stroke="#ccc6b3" stroke-opacity=".13" stroke-width="1.5"/>
  <path d="M232 401C339 450 548 478 701 405" stroke="#000" stroke-opacity=".3" stroke-width="1.2"/>
  <path d="M286 378C298 381 316 392 329 398L327 437C314 436 296 430 283 423L286 378Z" fill="#171815"/>
  <path d="M327 397C341 397 355 393 369 391L366 437C351 440 339 439 327 437V397Z" fill="#20211d"/>
  <path d="M319 394L333 397L331 439L317 435L319 394Z" fill="#2a2b25"/>
  <path d="M321 395L331 398" stroke="#c0bba9" stroke-opacity=".17"/>
  <path d="M288 383L316 400M337 403L362 397M288 418L316 428M337 431L360 432" stroke="#000" stroke-opacity=".24" stroke-width="1.5"/>
</svg>
